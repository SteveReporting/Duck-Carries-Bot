name: Bot Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
      - name: Test weapon pot calculator
        run: node tests/potCalculator.test.js
      - name: Test operations intelligence policy
        run: node tests/carryOpsPolicy.test.js
      - name: Test multi-guild selection policy
        run: node tests/guildSelectionPolicy.test.js
